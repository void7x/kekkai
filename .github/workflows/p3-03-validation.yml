name: P3-03 sanitizer evidence validation

on:
  push:
    branches:
      - feature/p3-03-sanitizer-evidence
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    timeout-minutes: 20
    steps:
      - name: Check out KEKKAI
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q engine tests scripts
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v
