name: Phase 2 validation

on:
  push:
    branches:
      - fix/phase2-security-remediation
  pull_request:
    branches:
      - fix/phase2-security-remediation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q engine tests scripts
      - name: Run complete unit and integration test suite
        run: python -m unittest discover -s tests -v
